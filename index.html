<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova Webs</title>
<style>
  :root { --teal:#0EB0A4; --bg:#0b1f22; --text:#f2f7f7; --muted:#9fb8b8; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:720px; margin:0 auto; padding:48px 16px; }
  img { height:32px; }
  h1 { font-size:2rem; margin:32px 0 8px; }
  p { color:var(--muted); }
  ul { list-style:none; padding:0; }
  li { border:1px solid rgba(14,176,164,.4); border-radius:10px; padding:16px; margin:12px 0; }
  li span { color:var(--muted); font-size:.9rem; }
</style>
</head>
<body>
<main>
  <img src="visuals/logos/nova_logo_color_negative.svg" alt="Nova">
  <h1>Nova Webs</h1>
  <p>Plantillas y webs de Nova.</p>
  <ul>
    <li>Certificados <span>(próximamente)</span></li>
    <li>Development Programs <span>(próximamente)</span></li>
  </ul>
</main>
</body>
</html>
