<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=656">
<title>Nova Connect Cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=block" rel="stylesheet">
<!--
  Plantilla de cover de eventos Nova Connect — 656 × 369 px (16:9).
  Parámetros por URL (todos opcionales; si faltan se usa el ejemplo):
    v      a | b | c                  (propuesta de diseño)
    photo  ruta del PNG del speaker SIN fondo
    logo   logo de empresa en blanco (para fondos oscuros: a y c)
    logoDark  logo de empresa en negro (para fondo claro: b)
    name   nombre del speaker
    role   cargo del speaker
  Ejemplo: cover.html?v=a&name=Ana%20López&role=Head%20of%20Strategy&photo=ejemplo/speaker.png
-->
<style>
  :root{
    --teal:#0EB0A4; --teal-light:#5eead4; --dark:#131C24; --veil:#1d2a30;
    --white:#ffffff; --muted:#9fb8b8; --ink:#131C24; --paper:#F3F6F5;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:656px;height:369px;overflow:hidden;background:#000}
  body{font-family:"DM Sans",system-ui,sans-serif;font-variation-settings:"opsz" 14;-webkit-font-smoothing:antialiased}
  .stage{position:relative;width:656px;height:369px;overflow:hidden}
  .speaker{position:absolute;bottom:0;object-fit:contain;object-position:bottom center;z-index:3}
  .nova{position:absolute;z-index:4}
  .company{display:block;max-width:150px;max-height:34px;object-fit:contain;object-position:left center}
  .name{font-weight:700;line-height:1.05;letter-spacing:-.01em}
  .role{font-weight:400;line-height:1.3}
  .pill{display:inline-block;font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
        padding:5px 12px;border-radius:999px}

  /* ---------- A · Glow (oscuro) ---------- */
  .v-a{background:radial-gradient(circle at 74% 42%, #0c332d 0%, #071b18 42%, #030908 75%, #000 100%)}
  .v-a .ring{position:absolute;width:300px;height:300px;border-radius:50%;right:28px;top:22px;
             border:1.5px solid rgba(14,176,164,.55);box-shadow:0 0 60px rgba(14,176,164,.25), inset 0 0 60px rgba(14,176,164,.12);z-index:1}
  .v-a .ring2{position:absolute;width:360px;height:360px;border-radius:50%;right:-2px;top:-8px;
             border:1px solid rgba(14,176,164,.18);z-index:1}
  .v-a .speaker{right:62px;height:340px;max-width:300px;filter:drop-shadow(0 0 30px rgba(0,0,0,.45))}
  .v-a .nova{left:36px;top:30px;height:18px}
  .v-a .pill{position:absolute;left:36px;top:64px;color:#fff;border:1.5px solid var(--teal);background:rgba(14,176,164,.08)}
  .v-a .text{position:absolute;left:36px;bottom:40px;width:300px;z-index:4}
  .v-a .company{margin-bottom:16px}
  .v-a .name{color:#fff;font-size:30px}
  .v-a .role{color:var(--muted);font-size:14px;margin-top:8px}
  .v-a .bar{width:36px;height:3px;background:var(--teal);margin:14px 0 0}

  /* ---------- B · Claro ---------- */
  .v-b{background:var(--paper)}
  .v-b .disc{position:absolute;width:330px;height:330px;border-radius:50%;right:22px;top:40px;
             background:radial-gradient(circle at 40% 30%, #2fd3c6 0%, var(--teal) 55%, #06817c 100%);z-index:1}
  .v-b .dots{position:absolute;right:300px;top:34px;width:70px;height:70px;z-index:1;
             background-image:radial-gradient(rgba(14,176,164,.55) 1.5px, transparent 1.6px);background-size:12px 12px}
  .v-b .speaker{right:50px;height:345px;max-width:300px}
  .v-b .nova{left:36px;top:30px;height:18px}
  .v-b .text{position:absolute;left:36px;top:50%;transform:translateY(-38%);width:290px;z-index:4}
  .v-b .company{margin-bottom:18px;max-height:30px}
  .v-b .name{color:var(--ink);font-size:30px;padding-left:14px;border-left:4px solid var(--teal)}
  .v-b .role{color:#4b5b63;font-size:14px;margin-top:8px;padding-left:18px}
  .v-b .pill{position:absolute;left:36px;bottom:30px;color:var(--teal);border:1.5px solid var(--teal);background:#fff}

  /* ---------- C · Split teal ---------- */
  .v-c{background:var(--dark)}
  .v-c .panel{position:absolute;right:0;top:0;width:290px;height:100%;z-index:1;
              background:linear-gradient(160deg, #13c3b6 0%, var(--teal) 45%, #06817c 100%)}
  .v-c .arcs{position:absolute;right:0;top:0;width:290px;height:100%;z-index:2;overflow:hidden;
             background:repeating-radial-gradient(circle at 105% 115%, rgba(255,255,255,0) 0 22px, rgba(255,255,255,.14) 22px 23.5px)}
  .v-c .speaker{right:40px;height:335px;max-width:300px;filter:drop-shadow(-12px 0 24px rgba(0,0,0,.30))}
  .v-c .nova{left:36px;top:30px;height:18px}
  .v-c .text{position:absolute;left:36px;bottom:36px;width:300px;z-index:4}
  .v-c .company{margin-bottom:auto}
  .v-c .companybox{position:absolute;left:36px;top:50%;transform:translateY(-110%);z-index:4}
  .v-c .name{color:#fff;font-size:32px}
  .v-c .role{color:var(--teal-light);font-size:14px;margin-top:8px}
  .v-c .pill{position:absolute;right:16px;top:18px;z-index:4;color:var(--dark);background:#fff}
  .v-c .veil{position:absolute;left:0;bottom:0;width:100%;height:4px;background:var(--teal);z-index:5}
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script>
  const q = new URLSearchParams(location.search);
  const v = (q.get('v') || 'a').toLowerCase();
  const d = {
    photo: q.get('photo') || 'ejemplo/speaker.png',
    logo: q.get('logo') || 'ejemplo/logo_blanco.png',
    logoDark: q.get('logoDark') || 'ejemplo/logo_negro.png',
    name: q.get('name') || 'Speaker Name',
    role: q.get('role') || 'Role at Company',
  };
  const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const NOVA_DARK_BG = '../logos/nova_logo_color_negative.svg';
  const NOVA_LIGHT_BG = '../logos/nova_logo_color_positive.svg';
  const name = esc(d.name), role = esc(d.role);
  const T = {
    a: `<div class="ring2"></div><div class="ring"></div>
        <img class="nova" src="${NOVA_DARK_BG}" alt="Nova">
        <span class="pill">Nova Connect</span>
        <img class="speaker" src="${d.photo}" alt="">
        <div class="text"><img class="company" src="${d.logo}" alt="">
          <div class="name">${name}</div><div class="role">${role}</div><div class="bar"></div></div>`,
    b: `<div class="dots"></div><div class="disc"></div>
        <img class="nova" src="${NOVA_LIGHT_BG}" alt="Nova">
        <img class="speaker" src="${d.photo}" alt="">
        <div class="text"><img class="company" src="${d.logoDark}" alt="">
          <div class="name">${name}</div><div class="role">${role}</div></div>
        <span class="pill">Nova Connect</span>`,
    c: `<div class="panel"></div><div class="arcs"></div>
        <img class="nova" src="${NOVA_DARK_BG}" alt="Nova">
        <span class="pill">Nova Connect</span>
        <img class="speaker" src="${d.photo}" alt="">
        <div class="companybox"><img class="company" src="${d.logo}" alt=""></div>
        <div class="text"><div class="name">${name}</div><div class="role">${role}</div></div>
        <div class="veil"></div>`,
  };
  const stage = document.getElementById('stage');
  stage.className = 'stage v-' + (T[v] ? v : 'a');
  stage.innerHTML = T[v] || T.a;
  // Si falta una imagen (p. ej. en la web pública, sin ejemplo), se oculta en vez de salir rota.
  stage.querySelectorAll('img').forEach(i => i.addEventListener('error', () => i.style.display = 'none'));
  // Nombres largos: reduce la letra hasta que quepa en 2 líneas.
  document.fonts.ready.then(() => {
    const n = stage.querySelector('.name'); if (!n) return;
    let fs = parseFloat(getComputedStyle(n).fontSize);
    while (n.scrollHeight > fs * 1.05 * 2 + 2 && fs > 18) { fs -= 1; n.style.fontSize = fs + 'px'; }
  });
</script>
</body>
</html>
